SectionVerb {
	# PipeWire probes the PCM after setting the verb, before enabling Speaker.
	# The AudioReach PCM needs its backend connected for that probe to open.
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Configure capture before PipeWire probes MultiMedia2 (PCM 1).
		# NORMAL uses 9.6 MHz PDM, matching the TX sample interval of 2.
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
		cset "name='ADC1 Volume' 6"
		cset "name='ADC2 Volume' 6"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX1 MODE' ADC_NORMAL"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC2 MUX' CH2_AMIC3"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='TX0 SEQUENCER Switch' 1"
		cset "name='TX1 SEQUENCER Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC4"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX0 SEQUENCER Switch' 0"
		cset "name='TX1 SEQUENCER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='TX DEC0 MUX' ZERO"
		cset "name='TX DEC1 MUX' ZERO"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in stereo speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}


SectionDevice."Mic" {
	Comment "Built-in microphones (AMIC1 and AMIC3)"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
		CaptureRate 48000
		CaptureMixerElem "TX_DEC0"
	}
}
